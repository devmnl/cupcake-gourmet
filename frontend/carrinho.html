<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupcake Gourmet - Carrinho</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">
                <span class="logo-icon">🧁</span>
                <span>Cupcake Gourmet</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="carrinho.html" class="active">Carrinho <span class="cart-count" id="cartCount">0</span></a></li>
                <li><a href="acompanhar.html">Acompanhar</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section">
            <h2>Seu Carrinho</h2>
            <div class="cart-container" id="cartContainer">
                <div class="empty-cart" id="emptyCart">
                    <div class="empty-cart-icon">🛒</div>
                    <h3>Seu carrinho está vazio</h3>
                    <p style="margin: 1rem 0;">Adicione alguns cupcakes deliciosos!</p>
                    <a href="produtos.html" class="btn">Ver Produtos</a>
                </div>
                <div id="cartContent" class="hidden">
                    <div id="cartItems"></div>
                    <div class="cart-summary">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="subtotal">R$ 0,00</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span id="total">R$ 0,00</span>
                        </div>
                    </div>
                    <div class="cart-actions">
                        <a href="produtos.html" class="btn btn-secondary">Continuar Comprando</a>
                        <a href="finalizar.html" class="btn btn-success">Finalizar Pedido</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cupcake Gourmet - Todos os direitos reservados</p>
    </footer>

    <script src="js/carrinho.js"></script>
</body>
</html>
